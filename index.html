<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2545">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Field Photos">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Field Photos</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app"><p class="loading">Loading…</p></div>
  <div id="overlay"></div>
  <div id="print-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <!-- Visually hidden (not display:none) so iOS will open them from a tap. -->
  <input id="camera-input" class="vh" type="file" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
  <input id="library-input" class="vh" type="file" accept="image/*" multiple tabindex="-1" aria-hidden="true">
  <noscript>This app needs JavaScript turned on.</noscript>
</body>
</html>
