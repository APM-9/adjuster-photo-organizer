# Static site: no build step, publish the repo root.
[build]
  publish = "."

# Let phones pick up new versions of the offline worker right away.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# The whole repo folder is published; keep private docs off the site.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
